<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Fracciones</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="funciones.js"></script>
</head>

<body>
    
    <div class="calculadora">
        <h1>Calculadora de Fracciones</h1>

        <div class="fraccion">
            <input type="number" id="num1" placeholder="Numerador">
            <hr>
            <input type="number" id="den1" placeholder="Denominador">
        </div>

        <select id="operacion">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
        </select>

        <div class="fraccion">
            <input type="number" id="num2" placeholder="Numerador">
            <hr>
            <input type="number" id="den2" placeholder="Denominador">
        </div>

        <button onclick="calcular()">Calcular</button>

        <h2>Resultado:</h2>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
